<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The GitHub Pages workflow sets the base path (e.g. /AzurePowerTool/). -->
    <base href="/" />
    <title>Azure PowerTool</title>
    <link rel="stylesheet" href="app.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
</head>

<body>

    <script src="lib/msal-browser-4.30.0/msal-browser.min.js"></script>

    <script>
        // Handle the redirect back from the Microsoft sign-in before the app starts routing.
        powerToolAuth.init().finally(() => Blazor.start());

</html>
